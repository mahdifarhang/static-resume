# Shared SSL configuration
# Main domain - redirect to resume subdomain
server {
	server_name	mfarhang.ir;

	location /files {
		mp4;
                mp4_buffer_size     1M;
                mp4_max_buffer_size 3M;
		autoindex on;
		autoindex_exact_size off;
		autoindex_localtime on;
		root /media;
	}

	location /extra_files {
                autoindex on;
                autoindex_exact_size off;
                autoindex_localtime on;
		root /media;
	}

	# Redirect everything else to resume subdomain
	location / {
		return 301 https://resume.mfarhang.ir$request_uri;
	}

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/mfarhang.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mfarhang.ir/privkey.pem; # managed by Certbot
}

# Resume subdomain - serve resume content
server {
	server_name	resume.mfarhang.ir;

	location / {
		root /var/www/mfarhang.ir/html; 
		try_files $uri $uri/ =404;
	}

    listen [::]:443 ssl;
    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/mfarhang.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mfarhang.ir/privkey.pem; # managed by Certbot
}

# HTTP to HTTPS redirect for mfarhang.ir
server {
    if ($host = mfarhang.ir) {
        return 301 https://$host$request_uri;
    }

	server_name	mfarhang.ir;	
	listen 80;
        listen [::]:80;
    return 404;
}

# HTTP to HTTPS redirect for resume.mfarhang.ir
server {
    if ($host = resume.mfarhang.ir) {
        return 301 https://$host$request_uri;
    }

	server_name	resume.mfarhang.ir;	
	listen 80;
        listen [::]:80;
    return 404;
}
